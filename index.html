<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Call List">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Morning Call List</title>
<style>
:root { --bg:#f4f6f9; --card:#fff; --ink:#1d2433; --muted:#5b6474; --line:#dfe3ea; --accent:#1f6feb; --ok:#1a7f37; --chip:#e8edf5; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#12151c; --card:#1b2030; --ink:#e8ecf3; --muted:#9aa4b5; --line:#2c3446; --accent:#4f9dff; --ok:#3fb950; --chip:#242b3d; } }
:root[data-theme="dark"] { --bg:#12151c; --card:#1b2030; --ink:#e8ecf3; --muted:#9aa4b5; --line:#2c3446; --accent:#4f9dff; --ok:#3fb950; --chip:#242b3d; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif; padding-bottom:env(safe-area-inset-bottom); }
header { position:sticky; top:0; background:var(--bg); padding:14px 16px 8px; border-bottom:1px solid var(--line); z-index:2; }
h1 { font-size:19px; margin:0 0 4px; }
.stats { color:var(--muted); font-size:13px; margin-bottom:8px; }
input[type=search], input[type=text] { width:100%; font-size:16px; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); }
.chips { display:flex; gap:6px; overflow-x:auto; margin-top:8px; padding-bottom:2px; }
.chip { flex:0 0 auto; border:0; background:var(--chip); color:var(--ink); padding:7px 12px; border-radius:999px; font-size:13px; }
.chip.on { background:var(--accent); color:#fff; }
main { padding:12px 16px 40px; max-width:640px; margin:0 auto; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; }
.card.called .name { color:var(--muted); }
.card.called a.call { background:#dc2626; }
.hide { display:flex; align-items:center; gap:8px; font-size:15px; color:var(--muted); margin:8px 0 0; }
.name { font-weight:600; font-size:16px; line-height:1.3; }
.meta { color:var(--muted); font-size:13px; margin-top:3px; }
.btns { display:flex; gap:8px; margin-top:10px; }
.call { flex:1; display:block; text-align:center; text-decoration:none; background:var(--accent); color:#fff; font-weight:600; font-size:17px; padding:13px; border-radius:10px; }
.copy { flex:0 0 auto; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:14px; padding:0 14px; border-radius:10px; }
.row { display:flex; gap:10px; align-items:center; margin-top:10px; }
.row label { display:flex; align-items:center; gap:6px; font-size:15px; white-space:nowrap; }
.row input[type=checkbox] { width:20px; height:20px; }
.row input[type=text] { font-size:15px; padding:9px 10px; }
.note { color:var(--muted); font-size:12px; margin-top:6px; }
.ok { color:var(--ok); font-weight:600; }
.empty { color:var(--muted); text-align:center; padding:30px 0; }
.status { width:100%; font-size:15px; padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); margin-top:8px; }
.reset { border:0; background:none; color:var(--muted); font-size:13px; text-decoration:underline; padding:8px 0; }
</style>
</head>
<body>
<header>
  <h1>Morning Call List</h1>
  <div class="stats" id="stats"></div>
  <input type="search" id="q" placeholder="Search name, city, or type">
  <label class="hide"><input type="checkbox" id="hidecalled"> Hide businesses I've already called</label>
  <div class="chips" id="chips"></div>
  <div class="chips" id="tagchips"></div>
</header>
<main>
  <div id="list"></div>
  <div class="empty" id="empty" hidden>No businesses match.</div>
  <p class="note" id="syncnote"></p>
  <button class="reset" id="reset">Clear all statuses</button>
</main>

const STATUSES = ["Not called","Left message","Not interested","Scheduled","Spoke to receptionist","No answer","No mailbox","Call back","Emailed","Wrong number","Other"];
const CALLED_STATUSES = ["Left message","Not interested","Scheduled","Spoke to receptionist","No answer","No mailbox","Call back","Emailed","Wrong number","Other"];
const KEY = "morning-call-list-v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { state = {}; }
let db = null, synced = false;
function persistLocal() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const types = ["All"].concat([...new Set(BUSINESSES.map(b => b.type))].sort());
let filter = "All", tagFilter = "All", query = "";

function saveRow(id) {
  const s = state[id] || {};
  persistLocal();
  if (!db) return;
  try {
    db.doc("calls/" + id).set({ status: s.status || "Not called", outcome: s.outcome || "", pressed: !!s.pressed, updated: new Date().toISOString() })
      .catch(() => { document.getElementById("syncnote").textContent = "Could not save to the shared list. Your changes are kept on this device."; });
  } catch (e) {}
}

async function connect() {
  try {
    if (!window.claude || typeof window.claude.use !== "function") return;
    db = await window.claude.use("db");
    if (!db) return;
    try {
      const snap = await db.collection("calls").get();
      const docs = (snap && (snap.docs || snap)) || [];
      docs.forEach(d => {
        const id = Number(d.id);
        const data = d.data ? d.data() : d.data;
        if (!isNaN(id) && data) state[id] = { status: data.status || "Not called", outcome: data.outcome || "", pressed: !!data.pressed };
      });
      synced = true;
      persistLocal();
      renderList();
    } catch (e) {}
    document.getElementById("syncnote").textContent = synced ? "Shared list: changes save for everyone with this page." : "";
  } catch (e) {}
}

const TAGS = ["All", "Ads running", "Analytics only", "No ad tags", "No website", "Error or blocked"];
function tagCat(c) {
  c = String(c || "");
  if (c.startsWith("Ads tracking")) return "Ads running";
  if (c.startsWith("Analytics only")) return "Analytics only";
  if (c.startsWith("No ad tags")) return "No ad tags";
  if (c.startsWith("No website")) return "No website";
  return "Error or blocked";
}
function renderTagChips() {
  const box = document.getElementById("tagchips");
  box.innerHTML = "";
  TAGS.forEach(t => {
    const b = document.createElement("button");
    b.className = "chip" + (t === tagFilter ? " on" : "");
    b.textContent = t;
    b.onclick = () => { tagFilter = t; renderTagChips(); renderList(); };
    box.appendChild(b);
  });
}
function renderChips() {
  const box = document.getElementById("chips");
  box.innerHTML = "";
  types.forEach(t => {
    const b = document.createElement("button");
    b.className = "chip" + (t === filter ? " on" : "");
    b.textContent = t;
    b.onclick = () => { filter = t; renderChips(); renderList(); };
    box.appendChild(b);
  });
}

function renderStats() {
  const done = BUSINESSES.filter(b => state[b.id] && CALLED_STATUSES.includes(state[b.id].status)).length;
  document.getElementById("stats").textContent = done + " of " + BUSINESSES.length + " have a status";
}

function isCalled(id) {
  const s = state[id] || {};
  return !!s.pressed || CALLED_STATUSES.includes(s.status);
}
function renderList() {
  const list = document.getElementById("list");
  const q = query.trim().toLowerCase();
  const rows = BUSINESSES.filter(b => (filter === "All" || b.type === filter) && (tagFilter === "All" || tagCat(b.check) === tagFilter) &&
    (!q || (b.name + " " + b.city + " " + b.type).toLowerCase().includes(q)) &&
    !(document.getElementById("hidecalled").checked && isCalled(b.id)));
  document.getElementById("empty").hidden = rows.length > 0;
  list.innerHTML = "";
  rows.forEach(b => {
    const s = state[b.id] || { status: "Not called", outcome: "" };
    const card = document.createElement("div");
    card.className = "card" + (isCalled(b.id) ? " called" : "");
    const meta = [b.type, b.city, b.rating ? "Rating " + b.rating : ""].filter(Boolean).join(" | ");
    const opts = STATUSES.map(o => `<option ${o === s.status ? "selected" : ""}>${esc(o)}</option>`).join("");
    card.innerHTML = `
      <div class="name">${esc(b.name)}</div>
      <div class="meta">${esc(meta)}</div>
      <div class="meta">Website check: ${esc(b.check || "Not checked")}</div>
      <div class="btns">
        <a class="call" href="tel:${esc(b.tel)}">Call ${esc(b.phone)}</a>
        <button class="copy" type="button">Copy</button>
      </div>
      <select class="status">${opts}</select>
      <input class="outcome" type="text" placeholder="Notes (e.g. call back Monday 9am)" value="${esc(s.outcome || "")}">
      ${b.notes ? '<div class="note">' + esc(b.notes) + '</div>' : ''}`;
    const callLink = card.querySelector("a.call");
    callLink.onclick = () => {
      state[b.id] = { ...(state[b.id] || { status: "Not called", outcome: "" }), pressed: true };
      saveRow(b.id);
      card.classList.add("called");
      renderStats();
    };
    const sel = card.querySelector(".status");
    const tx = card.querySelector(".outcome");
    const copy = card.querySelector(".copy");
    copy.onclick = () => {
      const done = () => { copy.textContent = "Copied"; setTimeout(() => copy.textContent = "Copy", 1200); };
      try { navigator.clipboard.writeText(b.phone).then(done, () => { copy.textContent = b.phone; }); }
      catch (e) { copy.textContent = b.phone; }
    };
    sel.onchange = () => { state[b.id] = { ...state[b.id], status: sel.value, outcome: tx.value }; saveRow(b.id); card.classList.toggle("called", isCalled(b.id)); renderStats(); };
    tx.oninput = () => { state[b.id] = { ...state[b.id], status: sel.value, outcome: tx.value }; saveRow(b.id); };
    list.appendChild(card);
  });
  renderStats();
}

document.getElementById("q").oninput = e => { query = e.target.value; renderList(); };
let resetArmed = false;
document.getElementById("reset").onclick = (e) => {
  const btn = e.currentTarget;
  if (!resetArmed) { resetArmed = true; btn.textContent = "Tap again to clear all statuses"; return; }
  BUSINESSES.forEach(b => { state[b.id] = { status: "Not called", outcome: "" }; saveRow(b.id); });
  resetArmed = false; btn.textContent = "Clear all statuses"; renderList();
};
document.getElementById("hidecalled").onchange = renderList;
renderChips(); renderTagChips(); renderList(); connect();
</script>
